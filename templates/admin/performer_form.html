{% extends "admin/base_admin.html" %}
{% block title %}Performer | Admin{% endblock %}
{% block content %}
<div class="container" style="max-width:640px;padding:40px 20px;">
<h2 style="color:var(--text);margin-bottom:16px;">{% if item %}Edit{% else %}Add{% endif %} Top Performer</h2>
<form method="POST" enctype="multipart/form-data" class="card" style="padding:24px;">
<div class="form-group"><label>Name *</label><input name="name" class="form-control" value="{{ item.name if item else '' }}" required></div>
<div class="form-group"><label>Category</label>
<select name="category" class="form-control">
{% for c in ['Top Scorer', 'Assists', 'Clean Sheets', 'Player of the Month', 'Man of the Match', 'Most Goals', 'Most Assists'] %}
<option value="{{ c }}" {% if item and item.category == c %}selected{% endif %}>{{ c }}</option>
{% endfor %}
</select></div>
<div class="form-group"><label>Value (goals / assists number)</label><input type="number" name="value" class="form-control" value="{{ item.value if item else 0 }}"></div>
<div class="form-group"><label>Team</label><input name="team" class="form-control" value="{{ item.team if item else 'Pathari-11 FC' }}"></div>
<div class="form-group"><label>Order</label><input type="number" name="order" class="form-control" value="{{ item.order if item else 0 }}"></div>
<div class="form-group"><label>Season</label><input name="season" class="form-control" value="{{ item.season if item else '2025/26' }}"></div>
<div class="form-group"><label><input type="checkbox" name="is_published" {% if not item or item.is_published %}checked{% endif %}> Published</label></div>
<div class="form-group"><label>Photo — choose file</label><input type="file" name="photo" class="form-control" accept="image/*"></div>
<div class="form-group"><label>OR paste photo URL</label><input type="url" name="photo_url" class="form-control" placeholder="https://..."></div>
{% if item and item.photo %}<p><img src="{% if item.photo.startswith('http') %}{{ item.photo }}{% else %}{{ item.photo|media_url }}{% endif %}" style="height:80px;border-radius:8px;"></p>{% endif %}
<button class="btn btn-primary">Save</button>
<a href="{{ url_for('admin.performers_list') }}" class="btn btn-outline">Back</a>
</form>
</div>
{% endblock %}
