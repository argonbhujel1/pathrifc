<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2FA Verification | Pathari-11 FC Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-messages">
    {% for category, message in messages %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}
  <section class="section">
    <div class="container" style="max-width:400px;">
      <div class="card" style="padding:32px;">
        <h2 style="color:var(--text);text-align:center;margin-bottom:8px;font-family:var(--font-display);">Authenticator</h2>
        <p class="text-muted text-center" style="margin-bottom:24px;font-size:0.85rem;">Enter the 6-digit code from Google Authenticator or any TOTP app</p>
        <form method="POST">
          <div class="form-group">
            <label>Authentication code</label>
            <input type="text" name="code" class="form-control" inputmode="numeric" pattern="[0-9 ]{6,8}" maxlength="8" autocomplete="one-time-code" required autofocus placeholder="000000" style="letter-spacing:0.3em;text-align:center;font-size:1.3rem;">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Verify</button>
        </form>
        <p class="text-center mt-2"><a href="{{ url_for('admin.login') }}" class="text-muted" style="font-size:0.85rem;">← Back to login</a></p>
      </div>
    </div>
  </section>
</body>
</html>
