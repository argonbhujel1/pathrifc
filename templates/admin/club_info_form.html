{% extends "admin/base_admin.html" %}
{% block title %}Edit Club Info | Admin{% endblock %}
{% block content %}
<div class="container" style="max-width:720px;padding:40px 20px;">
  <h2 style="color:var(--text);margin-bottom:16px;">{% if item %}Edit{% else %}Add{% endif %} Club Info</h2>
  <form method="POST" enctype="multipart/form-data" class="card" style="padding:24px;">
    <div class="form-group">
      <label>Key (unique)</label>
      <input name="key" class="form-control" value="{{ item.key if item else '' }}" placeholder="about_story / trophy_cabinet / club_timeline" {% if item %}readonly{% endif %}>
    </div>
    <div class="form-group">
      <label>Title</label>
      <input name="title" class="form-control" value="{{ item.title if item else '' }}">
    </div>
    <div class="form-group">
      <label>Content</label>
      <textarea name="content" class="form-control" rows="10">{{ item.content if item else '' }}</textarea>
    </div>
    <div class="form-group">
      <label>Image file</label>
      <input type="file" name="image" class="form-control" accept="image/*">
    </div>
    <div class="form-group">
      <label>OR image URL</label>
      <input type="url" name="image_url" class="form-control" placeholder="https://...">
    </div>
    {% if item and item.image %}<p><img src="{{ item.image|media_url }}" style="max-height:100px;"></p>{% endif %}
    <button class="btn btn-primary" type="submit">Save</button>
    <a href="{{ url_for('admin.club_info_list') }}" class="btn btn-outline">Back</a>
  </form>
</div>
{% endblock %}
