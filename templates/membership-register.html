{% extends "base.html" %}
{% block title %}Membership Registration | Pathari-11 FC{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1>Membership Registration</h1></div></div>
<section class="section"><div class="container" style="max-width:560px;">
  <form method="POST" enctype="multipart/form-data" class="card" style="padding:28px;">
    <div class="form-group"><label>Membership Plan *</label>
      <select name="plan_id" id="planSelect" class="form-control" required>
        {% for p in plans %}
        <option value="{{ p.id }}" data-price="{{ p.price }}" data-tickets="{{ p.free_tickets or 0 }}"
          {% if selected and selected.id == p.id %}selected{% endif %}>
          {{ p.name }} — {% if p.price == 0 %}FREE{% else %}Rs. {{ "{:,.0f}".format(p.price) }}{% endif %}
          {% if p.free_tickets %}(+{{ p.free_tickets }} match ticket{% if p.free_tickets > 1 %}s{% endif %}){% endif %}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Full Name *</label><input type="text" name="full_name" class="form-control" required></div>
    <div class="form-group"><label>Phone *</label><input type="tel" name="phone" class="form-control" required></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control"></div>
    <div class="form-group"><label>Date of Birth</label><input type="date" name="date_of_birth" class="form-control"></div>
    <div class="form-group"><label>Address</label><textarea name="address" class="form-control"></textarea></div>

    <div id="paymentBox">
      <h3 style="color:var(--text);margin:20px 0 12px;font-size:1rem;">Payment Verification</h3>
      <p class="text-muted" style="font-size:0.85rem;margin-bottom:12px;">For paid plans, submit payment details. Admin will verify before activating membership.</p>
      <div class="form-group"><label>Payment Method</label>
        <select name="payment_method" class="form-control">
          <option value="eSewa">eSewa</option>
          <option value="Khalti">Khalti</option>
          <option value="Bank Transfer">Bank Transfer</option>
          <option value="Cash">Cash</option>
        </select>
      </div>
      <div class="form-group"><label>Payment Reference / Transaction ID</label>
        <input type="text" name="payment_reference" class="form-control" placeholder="e.g. TXN123456">
      </div>
      <div class="form-group"><label>Payment Screenshot / Proof</label>
        <input type="file" name="payment_proof" class="form-control" accept="image/*,.pdf">
      </div>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Register Now</button>
  </form>
</div></section>
<script>
(function(){
  var sel = document.getElementById('planSelect');
  var box = document.getElementById('paymentBox');
  function toggle(){
    var opt = sel.options[sel.selectedIndex];
    var price = parseFloat(opt.getAttribute('data-price')||0);
    box.style.display = price === 0 ? 'none' : 'block';
  }
  sel.addEventListener('change', toggle);
  toggle();
})();
</script>
{% endblock %}
